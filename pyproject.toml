[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "modelaudit-agent"
version = "0.1.0"
description = "An evidence-grounded autonomous ML/CV experiment diagnosis agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24,<3",
    "pandas>=2.0,<4",
    "matplotlib>=3.7,<5",
]

[project.optional-dependencies]
agent = ["openai-agents>=0.4"]
dev = ["pytest>=8"]

[project.scripts]
modelaudit = "modelaudit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
